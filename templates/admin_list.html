<!doctype html><html><head><meta charset="utf-8"><title>Users</title>
<style>body{font-family:system-ui;margin:2rem}table{border-collapse:collapse;width:100%}td,th{border:1px solid #ddd;padding:.5rem}a,button{margin-right:.5rem}</style>
</head><body>
<h1>Users</h1>
<p><a href="/admin/users/new">+ New User</a></p>
<table>
<thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Actions</th></tr></thead>
<tbody>
{% for u in users %}
<tr>
  <td>{{u.id}}</td><td>{{u.name}}</td><td>{{u.email}}</td>
  <td>
    <a href="/admin/users/{{u.id}}/edit">Edit</a>
    <form action="/admin/users/{{u.id}}/delete" method="post" style="display:inline">
      <button type="submit" onclick="return confirm('Delete?')">Delete</button>
    </form>
  </td>
</tr>
{% endfor %}
</tbody>
</table>
</body></html>
